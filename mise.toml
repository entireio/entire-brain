fi
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
python3 benchmarks/agent-brain/audit_facts_eval.py \
  --manifest "$manifest" \
  --out-dir "$tmp" \
  --fail-on-flags
mkdir -p benchmarks/agent-brain/evidence/facts-eval
cp "$tmp"/facts-eval-audit-report.json "$tmp"/facts-eval-audit-report.md benchmarks/agent-brain/evidence/facts-eval/
'''

