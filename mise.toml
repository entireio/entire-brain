[tools]
# Keep aligned with the `go` directive in go.mod.
go = { version = "1.27.3" }
shellcheck = "0.11.0"

[tasks.fmt]
description = "Run gofmt"
run = "gofmt -s -w ."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks."test:mutations"]
description = "Verify that four deliberate bugs fail their regression assertions"
run = "go run ./tools/mutationcheck"

[tasks."test:ci"]
description = "Run tests with race detection"
run = "go test -race ./..."

# The pre-push gate CONTRIBUTING.md points at. Deliberately NOT `test`:
# `test` is cached, which is right for the inner loop and wrong as the last
# thing you do before pushing -- a cached pass says a previous tree was green,
# not this one. Deliberately NOT `test:ci` either: that is -race, and
# internal/cli alone runs 17-20 minutes under -race on a developer machine
# while saturating it. CI owns -race; this owns "is the tree I am about to
# push actually green".
[tasks."test:prepush"]
description = "Uncached full suite + fmt + vet, the gate before you push"
run = """
set -e
go test ./... -count=1
# gofmt -l PRINTS the offending files and still exits 0, so running it bare
# under `set -e` is a check that can never fail. CI gets this right; a
# pre-push gate that does not is worse than none, because it sends people to
# push work CI will reject for exactly the thing the gate claimed to cover.
unformatted=$(gofmt -l -s .)
if [ -n "$unformatted" ]; then
  echo "unformatted files:"
  echo "$unformatted"
  exit 1
fi
go vet ./...
"""

[tasks.lint]
description = "Check Go formatting and static analysis"
run = """
set -e
unformatted=$(gofmt -l -s .)
if [ -n "$unformatted" ]; then
  echo "unformatted files:"
  echo "$unformatted"
  exit 1
fi
go vet ./...
"""

[tasks."release:readiness"]
description = "Check the current Go source and supported builds"
depends = ["check"]

[tasks.build]
description = "Build the plugin binary (pure-Go fallback stack)"
run = "go build -o entire-brain ./cmd/entire-brain"

[tasks.install]
description = "Build and install the plugin into the local Entire CLI"
run = "scripts/install-local.sh"

[tasks.release]
description = "Build checksum-backed release archives under dist/"
run = "scripts/release.sh"

[tasks.build-all]
description = "Cross-build common Entire CLI plugin targets"
run = '''
set -e
for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
  GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
done
'''

[tasks.check]
description = "Run formatting, linting, tests, and builds"
depends = ["lint", "test:ci", "test:mutations", "build-all"]
