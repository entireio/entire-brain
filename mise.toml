[tools]
# Keep aligned with the `toolchain` directive in go.mod.
go = { version = "1.26.2" }
shellcheck = "0.11.0"

[tasks.fmt]
description = "Run gofmt"
run = "gofmt -s -w ."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks."test:ci"]
description = "Run tests with race detection"
run = "go test -race ./..."

[tasks."test:phase1"]
description = "Run deterministic Phase 1 semantic brain contract tests"
run = "ENTIRE_BRAIN_PHASE1_CI=1 go test -race ./internal/cli -run 'TestPhase1|TestSemantic|TestWorkspace|TestMCP|TestRefreshSemantic'"

[tasks."release:evidence"]
description = "Check retained release-candidate replay-lab evidence without rewriting tracked reports"
run = '''
set -e
python3 benchmarks/agent-brain/run_test.py
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
python3 benchmarks/agent-brain/audit_codex.py \
  --results benchmarks/agent-brain/evidence/release \
  --release-manifest benchmarks/agent-brain/evidence/release/manifest.json \
  --out-dir "$tmp" \
  --fail-on-flags
for report in codex-audit-report.json codex-audit-report.md; do
  committed="benchmarks/agent-brain/evidence/release/$report"
  generated="$tmp/$report"
  if ! cmp -s "$committed" "$generated"; then
    echo "retained release evidence report is stale: $report" >&2
    diff -u "$committed" "$generated" >&2 || true
    echo "run: mise run release:evidence:update" >&2
    exit 1
  fi
done
'''

[tasks."release:evidence:update"]
description = "Regenerate retained release-candidate replay-lab audit reports after the release gate passes"
run = '''
set -e
python3 benchmarks/agent-brain/run_test.py
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
python3 benchmarks/agent-brain/audit_codex.py \
  --results benchmarks/agent-brain/evidence/release \
  --release-manifest benchmarks/agent-brain/evidence/release/manifest.json \
  --out-dir "$tmp" \
  --fail-on-flags
mkdir -p benchmarks/agent-brain/evidence/release
cp "$tmp"/codex-audit-report.json "$tmp"/codex-audit-report.md benchmarks/agent-brain/evidence/release/
'''

[tasks."radar:screen"]
description = "Summarize Regression Radar pilots and flag saturated candidates"
run = '''
set -e
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
python3 benchmarks/agent-brain/audit_radar_evidence.py \
  --results benchmarks/agent-brain/results \
  --suite-glob 'pilot-radar-*' \
  --out-dir "$tmp"
cat "$tmp/radar-candidate-report.md"
'''

[tasks."radar:evidence"]
description = "Require at least one retained proof-ready Regression Radar comparison"
run = '''
set -e
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
python3 benchmarks/agent-brain/audit_radar_evidence.py \
  --results benchmarks/agent-brain/evidence/release \
  --suite-glob 'release-candidate-*' \
  --out-dir "$tmp" \
  --fail-when-no-proof
cat "$tmp/radar-candidate-report.md"
'''

[tasks."facts:evidence"]
description = "Check retained facts-vs-raw eval evidence without rewriting tracked reports"
run = '''
set -e
manifest="benchmarks/agent-brain/evidence/facts-eval/manifest.json"
if [ ! -f "$manifest" ]; then
  echo "facts eval evidence manifest is missing: $manifest" >&2
  echo "collect paired facts/history/query/raw-sessions eval artifacts before citing facts-vs-raw proof" >&2
  exit 1
fi
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
python3 benchmarks/agent-brain/audit_facts_eval.py \
  --manifest "$manifest" \
  --out-dir "$tmp" \
  --fail-on-flags
for report in facts-eval-audit-report.json facts-eval-audit-report.md; do
  committed="benchmarks/agent-brain/evidence/facts-eval/$report"
  generated="$tmp/$report"
  if ! cmp -s "$committed" "$generated"; then
    echo "retained facts eval evidence report is stale: $report" >&2
    diff -u "$committed" "$generated" >&2 || true
    echo "run: mise run facts:evidence:update" >&2
    exit 1
  fi
done
'''

