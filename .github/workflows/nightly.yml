name: nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily, matching entire-graph
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Only cut a nightly when main actually moved. A dated prerelease per day that
  # nothing changed is noise, and it makes "which nightly has the fix" harder to
  # answer, not easier.
  changed:
    name: has main moved
    runs-on: depot-ubuntu-24.04-4
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          base="$(grep -oE '^## +\[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md 2>/dev/null \
                    | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || base="0.1.0"
          version="v${base}-nightly.$(date -u +%Y%m%d%H%M).${sha}"

          # Skip when the newest prerelease already points at this commit.
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                     --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          if [[ "$latest" == *".${sha}" ]]; then
            echo "main has not moved since $latest — skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # Same gate as release.yml's verify windows job: test the shipped pure-Go
  # configuration (test.yml's Windows suite runs CGO_ENABLED=1 for the race
  # detector) and smoke-run the CLI on a real Windows runner. The nightly
  # builds and publishes in one job, so this verifies its own CGO_ENABLED=0
  # windows/amd64 build rather than the packaged artifact.
  windows-verify:
    name: verify windows
    needs: changed
    if: needs.changed.outputs.should_release == 'true'
    # Depot, like every other Windows job in this repo: hosted windows-latest
    # is 2-core for private repos and could not finish internal/cli (1,700+
    # test roots in one binary) inside 50 minutes. This does put a Depot
    # dependency on the publish path; during a Depot outage, releases wait.
    runs-on: depot-windows-2025-8
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
      # Fixture-heavy internal/cli tests build their recorded production-cohort
      # sizes only here; the per-PR suite runs them scaled down (see
      # internal/cli/scale_mode_test.go).
      ENTIRE_BRAIN_OBSERVED_SCALE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # Official current-main v7.0.0 bundle with the repeated-DOCTYPE parser fix.
        with:
          go-version: "1.27.x"
      - name: Test the shipped pure-Go configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # internal/cli runs as a precompiled binary we own, not under go test:
          # its tests re-exec os.Executable() to spawn detached workers, and a
          # worker outliving the suite keeps cli.test.exe mapped on Windows, so
          # go test's own temp cleanup fails the run with "unlinkat: Access is
          # denied" after every test passed. The per-PR Windows harness runs the
          # compiled binary directly for the same reason. The runner is
          # ephemeral, so nobody needs to delete our copy.
          # brain_harness keeps the eval/bench developer-harness tests in the
          # nightly suite (COR-2322); the shipped binary below stays untagged.
          $pkgs = (go list ./...) | Where-Object { $_ -notmatch '/internal/cli$' }
          go test -tags brain_harness -timeout 20m $pkgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags brain_harness -c -o "$env:RUNNER_TEMP/cli.test.exe" ./internal/cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location internal/cli
          # Quoted and =-joined: pwsh splits a bare -test.timeout=25m at the dot,
          # and a space-separated value leaks into os.Args as a positional that at
          # least one test (parsing os.Args through cobra) trips over.
          & "$env:RUNNER_TEMP/cli.test.exe" '-test.timeout=25m'
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
      - name: Build and smoke-run the CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go build -trimpath -o "$env:RUNNER_TEMP/entire-brain.exe" ./cmd/entire-brain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools/windows-sanity.ps1 -Binary "$env:RUNNER_TEMP/entire-brain.exe"

  build:
    name: nightly build
    needs: [changed, windows-verify]
    if: needs.changed.outputs.should_release == 'true'
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # Official current-main v7.0.0 bundle with the repeated-DOCTYPE parser fix.
        with:
          go-version: "1.27.x"

      - name: Build every target
        env:
          VERSION: ${{ needs.changed.outputs.version }}
        run: |
          set -euo pipefail
          bare="${VERSION#v}"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${t%/*}"; goarch="${t#*/}"
            out="entire-brain"; [[ "$goos" == windows ]] && out="entire-brain.exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${bare}" \
              -o "dist/$out" ./cmd/entire-brain
            asset="entire-brain_${bare}_${goos}_${goarch}"
            if [[ "$goos" == windows ]]; then
              (cd dist && zip -q "${asset}.zip" "$out" && rm "$out")
            else
              (cd dist && tar -czf "${asset}.tar.gz" "$out" && rm "$out")
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.changed.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f | sort)
          gh release create "$VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --prerelease \
            --generate-notes
